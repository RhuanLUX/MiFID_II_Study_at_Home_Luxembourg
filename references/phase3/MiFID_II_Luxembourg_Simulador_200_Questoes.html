const AREAS={"R":{"en":"Regulatory framework","pt":"Estrutura regulatória"},"M":{"en":"Financial markets","pt":"Mercados financeiros"},"B":{"en":"Debt instruments","pt":"Instrumentos de dívida"},"E":{"en":"Equities","pt":"Ações"},"D":{"en":"Derivatives","pt":"Derivativos"},"F":{"en":"Investment funds","pt":"Fundos de investimento"},"C":{"en":"Risk, compliance & regulation","pt":"Risco, compliance e regulação"},"A":{"en":"Investment advisory","pt":"Aconselhamento de investimentos"}};

const questionById=new Map(BANK.map(q=>[q.id,q]));
const randomInt=n=>Math.floor(Math.random()*n);
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(STORE,JSON.stringify({settings,session,lastExam}))}catch(e){}}
function translate(pair){return settings.pt?`<div class="pt-block" lang="pt-BR">${safe(pair.pt)}</div>`:''}

$('#eyeBtn').addEventListener('click',()=>{settings.pt=!settings.pt;save();updateEye();render()});
function examDraw(level){let all=[];
 const familyIndices=Object.keys(QUOTA).flatMap(cat=>{
   const candidates=[...new Set(BANK.filter(q=>q.cat===cat).map(q=>q.family))];
   if(candidates.length!==QUOTA[cat])throw Error('Módulo incompleto: '+cat);
   return shuffle(candidates)
 });
 const chosenHard=new Set(level==='mix'?shuffle(familyIndices).slice(0,25):level==='hard'?familyIndices:[]);
 for(const fam of familyIndices){const pool=BANK.filter(q=>q.family===fam&&q.level===(chosenHard.has(fam)?'hard':'base'));all.push(pool[randomInt(pool.length)])}
 return shuffle(all).map(x=>x.id)
}
function studyDraw(level,area){let ids=BANK.filter(q=>(level==='mix'||q.level===level)&&(area==='all'||q.cat===area));
 // Across the first pass, prefer one variant from each family before resurfacing sibling variants.
 const b=new Map();for(const x of shuffle(ids)){if(!b.has(x.family))b.set(x.family,[]);b.get(x.family).push(x.id)}
 const groups=[...b.values()];let output=[];let more=true;
 while(more){more=false;for(const group of shuffle(groups)){if(group.length){more=true;output.push(group.pop())}}}
 return output
}
function newRun(){const mode=settings.mode,level=settings.level,area=settings.area;
 const ids=mode==='exam'?examDraw(level):studyDraw(level,area);
 session={mode,level,area,ids,index:0,answers:{},finished:false,startedAt:Date.now(),deadline:mode==='exam'?Date.now()+150*60*1000:null,reviewPool:false};

}

 if($('#area'))$('#area').onchange=e=>{settings.area=e.target.value;save()};

function timeLeft(){return session?.deadline?Math.max(0,Math.ceil((session.deadline-Date.now())/1000)):0}
function timerText(sec){let mm=Math.floor(sec/60), ss=sec%60;return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function tick(){if(!session||session.mode!=='exam'||session.finished){resetTimer();return}if(timeLeft()<=0){endExam('time');return}const node=$('#timer');if(node)node.textContent=timerText(timeLeft())}
function questionCard(q,number,total,selected,locked,feedback=false){
 const valid=Number.isInteger(selected);const correct=q.correct;
 const opts=q.options.map((a,i)=>{const className=locked&&feedback?(i===correct?'correct':i===selected?'wrong':''):(i===selected?'selected':'');return `<button class="answer ${className}" type="button" data-opt="${i}" ${locked?'disabled':''} aria-pressed="${valid&&i===selected}"><span class="letter">${'ABCD'[i]}</span><span>${safe(a.en)}${translate(a)}</span></button>`}).join('');
 return `<div class="qhead"><span class="badge">${safe(lab(q))}</span><span class="badge">${q.level==='hard'?'Avançada':'Padrão'}</span></div><div class="qtitle">${safe(q.q.en)}${translate(q.q)}</div><div class="answers">${opts}</div>`
}

function questionView(){currentView='question';if(!session||session.finished){home();return}if(session.index>=session.ids.length){session.mode==='exam'?endExam('complete'):endStudy();return}
 if(session.mode==='exam'&&timeLeft()<=0){endExam('time');return}
 const idx=session.index,q=questionById.get(session.ids[idx]);if(!q){home();return}
 const selected=session.answers[q.id];const answered=Number.isInteger(selected),locked=session.mode==='study'&&answered;
 const kicker=session.mode==='exam'?'Modo simulado':'Modo estudo';const heading=`Questão ${idx+1} de ${session.ids.length}`;
 $('#main').innerHTML=`${headerBlock(kicker,heading,'')}

 <div class="progress"><div style="width:${(idx/session.ids.length*100).toFixed(2)}%"></div></div>
 <div class="panel">${questionCard(q,idx+1,session.ids.length,selected,locked,locked)}${locked?feedbackBox(q,selected):''}

 document.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>{
   if(session.mode==='study'&&Number.isInteger(session.answers[q.id]))return;

}
function resultsData(s){const data=s.ids.map((id,index)=>{const q=questionById.get(id),pick=s.answers[id];return {q,pick,index,correct:pick===q.correct,answered:Number.isInteger(pick)}});const total=data.filter(x=>x.correct).length;return {data,total,incorrect:data.filter(x=>!x.correct),percent:Math.round(total/data.length*100)}}
function endExam(reason){if(!session||session.mode!=='exam')return;resetTimer();session.finished=true;session.reason=reason;lastExam=JSON.parse(JSON.stringify(session));session=null;save();result()}

 <div class="errorlist">${rows.map((x,i)=>`<button type="button" data-review="${i}" class="number ${x.correct?'good':'bad'} ${i===reviewPos?'current':''}" title="Questão ${x.index+1}">${x.index+1}</button>`).join('')}</div>
 <div class="panel"><div class="row between small"><span>Questão original ${r.index+1} de 50</span><span>${r.correct?'Correta':'Incorreta / em branco'}</span></div><div class="rule"></div>${questionCard(q,r.index+1,50,r.pick,true,true)}${!r.answered?'<p class="small">Esta questão ficou sem resposta.</p>':''}${feedbackBox(q,r.pick)}<div class="actionrow"><button class="btn secondary" id="revPrev" ${reviewPos===0?'disabled':''}>← Anterior</button><button class="btn" id="revNext" ${reviewPos===rows.length-1?'disabled':''}>Seguinte →</button></div></div>`;
 $('#reviewBack').onclick=result;$('#switchReview').onclick=()=>{reviewType=reviewType==='wrong'?'all':'wrong';reviewPos=0;review()};$('#revPrev').onclick=()=>{reviewPos--;review()};$('#revNext').onclick=()=>{reviewPos++;review()};document.querySelectorAll('[data-review]').forEach(el=>el.onclick=()=>{reviewPos=Number(el.dataset.review);review()});
}
function render(){updateEye();if(currentView==='review'&&lastExam){review()}else if(currentView==='result'&&lastExam){result()}else if(session&&!session.finished){questionView()}else{home()}}
render();
